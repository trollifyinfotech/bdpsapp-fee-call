<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Trollify</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
</head><body>
<div class="auth-wrap"><div class="card auth-card"><div class="card-body p-4">
  <div class="text-center mb-4"><i class="bi bi-mortarboard-fill text-primary" style="font-size:2.4rem"></i><h4 class="mb-0 fw-bold">Trollify</h4><div class="text-muted small">School Fee &amp; Recovery Management</div></div>
  <div class="alert alert-danger d-none" id="err"></div>
  <form id="f" autocomplete="on">
    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="email" required autocomplete="username"></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <div class="input-group"><input type="password" class="form-control" id="pw" required autocomplete="current-password"><button class="btn btn-outline-secondary" type="button" id="eye" aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
    <button class="btn btn-primary w-100" id="go" type="submit">Sign in</button>
  </form>
  <div class="text-center mt-3 small">New school? <a href="register.html">Register your school</a></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/database.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script>
T.auth.requireConfig();
(async function () {
  const { data } = await sb.auth.getSession();
  if (data.session) { try { const a = await T.rpc("my_access"); location.replace(a.is_super_admin && !a.school_id ? "super-admin/index.html" : "app.html"); return; } catch (_) {} }
})();
const err = document.getElementById("err");
document.getElementById("eye").onclick = function () { const p = document.getElementById("pw"); p.type = p.type === "password" ? "text" : "password"; };
document.getElementById("f").onsubmit = async function (e) {
  e.preventDefault(); err.classList.add("d-none");
  const b = document.getElementById("go"); b.disabled = true; b.textContent = "Signing in…";
  try {
    const a = await T.auth.signIn(document.getElementById("email").value, document.getElementById("pw").value);
    location.replace(a.is_super_admin && !a.school_id ? "super-admin/index.html" : "app.html");
  } catch (ex) { err.textContent = ex.message; err.classList.remove("d-none"); b.disabled = false; b.textContent = "Sign in"; }
};
</script>
</body></html>

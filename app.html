<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trollify — School Fee &amp; Recovery</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
</head>
<body>
<header class="topbar">
  <button class="btn btn-light d-lg-none" id="menu-btn" aria-label="Menu"><i class="bi bi-list fs-5"></i></button>
  <a class="brand" id="brand" href="#/dashboard"></a>
  <div class="ms-auto d-flex align-items-center gap-2">
    <select id="sess-sel" class="form-select form-select-sm" style="width:auto;max-width:160px" title="Academic session"></select>
    <div class="dropdown">
      <button class="btn btn-light position-relative" id="bell-btn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-label="Notifications"><i class="bi bi-bell"></i><span id="bell-count" class="badge rounded-pill text-bg-danger bell-dot d-none">0</span></button>
      <div class="dropdown-menu dropdown-menu-end p-0" id="bell-menu" style="width:340px;max-width:92vw;max-height:70vh;overflow:auto"></div>
    </div>
    <div class="dropdown">
      <button class="btn btn-light d-flex align-items-center gap-2" data-bs-toggle="dropdown"><i class="bi bi-person-circle fs-5"></i><span class="d-none d-md-block text-start lh-1"><span id="u-name" class="small fw-semibold d-block"></span><span id="u-role" class="text-muted" style="font-size:.7rem"></span></span></button>
      <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="#/notifications"><i class="bi bi-bell me-2"></i>Notifications</a></li><li><a class="dropdown-item" href="#" id="logout"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li></ul>
    </div>
  </div>
</header>
<aside class="sidebar" id="side"><nav id="nav"></nav></aside>
<main class="main"><div id="view"><div class="loading"><div class="spinner-border spinner-border-sm me-2"></div>Loading…</div></div></main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/supabase-config.js"></script>
<script src="js/database.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/permissions.js"></script>
<script src="js/notifications.js"></script>
<script src="js/audit.js"></script>
<script src="js/students.js"></script>
<script src="js/families.js"></script>
<script src="js/fees.js"></script>
<script src="js/payments.js"></script>
<script src="js/receipts.js"></script>
<script src="js/calling-crm.js"></script>
<script src="js/reports.js"></script>
<script src="js/admin.js"></script>
<script src="js/app.js"></script>
<script>T.app.start().catch(function (e) { if (e && e.message !== "redirect") { console.error(e); document.getElementById("view").innerHTML = '<div class="alert alert-danger m-3">' + T.esc(T.errMsg(e)) + '</div>'; } });</script>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening TruKart...</title>

  <meta http-equiv="refresh" content="0;url=https://trukart.vercel.app">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #7A1E2B;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .loader {
      padding: 30px;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #F2A900;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h2 {
      margin-bottom: 8px;
    }

    p {
      color: #F6D58A;
    }
  </style>
</head>

<body>

  <div class="loader">
    <div class="spinner"></div>
    <h2>Opening TruKart</h2>
    <p>Please wait...</p>
  </div>

  <script>
    window.location.replace("https://trukart.vercel.app");
  </script>

</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Trollify Infotech Pvt. Ltd. | Pren Janghela</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase-config.js"></script></head>
<body><p style="font-family:sans-serif;padding:2rem">Loading…</p>
<script>
(async function () {
  try {
    if (!window.sb) { location.replace("login.html"); return; }
    const { data } = await sb.auth.getSession();
    if (!data.session) { location.replace("login.html"); return; }
    const { data: a } = await sb.rpc("my_access");
    location.replace(a && a.is_super_admin && !a.school_id ? "super-admin/index.html" : "app.html");
  } catch (_) { location.replace("login.html"); }
})();
</script></body></html>
